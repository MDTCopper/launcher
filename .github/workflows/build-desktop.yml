name: 手动构建（全平台）

# 手动跑一次**所有平台**的 release 构建，产物传到 Actions 的 Artifacts（不碰 release）。
# 用来在打 tag 之前验证各平台链路 —— 本机是 Windows，另外三个平台没法交叉构建。
# 构建统一走 tool/build_release.dart，与本地发布、release.yml 是同一个入口
#
# macOS 那条是 optional（continue-on-error）：dmg 链路还没在真机上跑通过，
# 红了不该拦着其它平台；也正因如此 release.yml 里不发 macOS
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（只填 0.3.0 这种；通道与序号用下面两项）。留空则沿用仓库里记录的版本
        required: false
        default: ''
      channel:
        description: 发布通道（预发布必须选 alpha / beta，否则自更新器会把内测包当正式版）
        type: choice
        options:
          - release
          - alpha
          - beta
        default: release
      seq:
        description: 通道序号（预发布用，如 alpha1 的 1）；留空则沿用/自动
        required: false
        default: ''
      skip_codesign:
        description: macOS 报签名错误时勾上（等价于给 xcodebuild 传 CODE_SIGNING_ALLOWED=NO）
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: 解析参数
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: parse
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            # 沿用仓库里记录的版本（app_constant.dart 的 appVersion）
            version=$(sed -n "s/^const appVersion = 'v\([0-9][0-9.]*\).*/\1/p" lib/core/app_constant.dart | head -1)
          fi
          if [ -z "$version" ]; then
            echo "::error::没给 version，也没能从 lib/core/app_constant.dart 读出版本"
            exit 1
          fi
          case "$version" in
            *-*)
              echo "::error::version 只填版本号（形如 0.3.0）；通道与序号请用 channel / seq 两项"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "构建版本 $version"

  build:
    name: ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    # 未验证的平台失败了不算这条 workflow 失败
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (tar.gz)
            runs-on: ubuntu-latest
            platform: linux
            package: tarball
          - label: Linux (AppImage)
            runs-on: ubuntu-latest
            platform: linux
            package: appimage
          - label: Android (apk)
            runs-on: ubuntu-latest
            platform: android
            package: none
          - label: Windows (Zip + Setup)
            runs-on: windows-latest
            platform: windows
            package: both
          - label: macOS (dmg，未验证)
            runs-on: macos-latest
            platform: macos
            package: dmg
            optional: true
    steps:
      - uses: actions/checkout@v4

      # macOS runner 自带 Xcode，不需要额外装东西
      # libsecret-1-dev 是 flutter_secure_storage_linux 编译时要的（漏了会在 flutter build linux 阶段失败）；
      # **libayatana-appindicator3-dev 同样不能少** —— tray_manager 的 Linux 端找不到
      # ayatana-appindicator3-0.1 / appindicator3-0.1 会直接 CMake FATAL_ERROR；
      # appimagetool 给 AppImage 打包用
      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.appimage
          chmod +x appimagetool-x86_64.appimage
          sudo mv appimagetool-x86_64.appimage /usr/local/bin/appimagetool

      # 本机跑的是 JDK 23、项目字节码目标是 17，取 21 这个两端都稳的 LTS。
      # JDK 还提供下面打签名指纹用的 keytool
      - name: 安装 JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk 37 未必在 runner 预装的 SDK 里；接受许可后由 Gradle 自己下
      - name: 接受 Android 许可
        if: matrix.platform == 'android'
        run: yes | sdkmanager --licenses > /dev/null || true

      # release apk 用的是 debug 签名（android/app/build.gradle.kts），而 runner 上
      # 没有 ~/.android/debug.keystore —— AGP 缺了会自己生成一把，那样每次跑都是新密钥，
      # 用包管理器覆盖安装会因签名不一致失败（只能卸载，而卸载清数据）
      # 内容 = 本机 ~/.android/debug.keystore 的 base64；没配 secret 就只警告、不拦
      - name: 还原 Android debug keystore
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::没配 ANDROID_DEBUG_KEYSTORE，这次 apk 用 runner 现生成的 debug 密钥"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "已还原 debug.keystore"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      # 一律 --no-check：test/ 不入库，CI 里没有测试目录，跑门禁必然失败。
      # 门禁在本机发布前跑（见 architecture.md 的发布清单）
      - name: 构建并打包
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SEQ: ${{ inputs.seq }}
          PLATFORM: ${{ matrix.platform }}
          PACKAGE: ${{ matrix.package }}
          SKIP_CODESIGN: ${{ inputs.skip_codesign }}
        run: |
          if [ "$SKIP_CODESIGN" = "true" ]; then
            export FLUTTER_XCODE_CODE_SIGNING_ALLOWED=NO
          fi

          args=(--version "$VERSION" --channel "$CHANNEL" --mode release --no-bump --no-check
                --yes --no-open-folder --platform "$PLATFORM" --package "$PACKAGE")
          if [ -n "$SEQ" ]; then args+=(--seq "$SEQ"); fi

          # 每个 matrix 条目都是全新 runner，所以这里**不能加 --no-build** ——
          # AppImage 也是先完整构建、再打包
          export APPIMAGETOOL=/usr/local/bin/appimagetool
          dart tool/build_release.dart "${args[@]}"

      # 打出 apk 的签名指纹：核对 CI 用的就是配进去的那把 debug 密钥。
      # 优先用 apksigner —— 新版 AGP 出来的 apk 可能只有 v2/v3 签名，
      # keytool / jarsigner 读不了那套；这步只是诊断，读不出来也不该拦产物上传
      - name: 打印 apk 签名指纹
        if: matrix.platform == 'android'
        continue-on-error: true
        run: |
          apksigner=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          echo "apksigner：${apksigner:-没找到}"
          ls -l build/dist || true
          for apk in build/dist/*.apk; do
            if [ ! -f "$apk" ]; then
              echo "没有任何 apk（展开成了「$apk」）"
              break
            fi
            echo "== $(basename "$apk") =="
            unzip -l "$apk" 2>/dev/null | grep -i 'META-INF/.*\.RSA' || echo "没有 v1 签名（META-INF/*.RSA）"
            if [ -n "$apksigner" ]; then
              "$apksigner" verify --print-certs "$apk" 2>&1 || echo "apksigner 读不出来"
            fi
            keytool -printcert -jarfile "$apk" 2>&1 | tail -20 || echo "keytool 读不出来"
          done

      # 产物名里带着这次构建的版本（脚本按 版本+通道+序号 命名），这里读回来 ——
      # artifact 光看名字得知道是哪一版；从产物读比在 resolve 里再拼一遍可靠，
      # 序号留空时脚本会自己挑一个
      - name: 读出这次构建的版本
        id: built
        shell: bash
        run: |
          first=$(ls build/dist/* 2>/dev/null | head -1)
          if [ -z "$first" ]; then
            echo "::error::build/dist 里没有任何产物，读不出版本"
            exit 1
          fi
          tag=$(basename "$first" | sed -E 's/^copper-launcher-(.*)-(windows|macos|linux|android)(-|\.).*$/\1/')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "这次构建的版本：$tag"

      # 一个包一个产物：Zip / Setup / 每个 ABI 的 apk 分开传。
      # 混在一起时下 26MB 只为拿其中一个太烦；而且缺了哪个包会被别的包盖住、看不出来
      - name: 上传产物（Windows Zip）
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: copper-launcher-${{ steps.built.outputs.tag }}-windows-zip
          path: build/dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: 上传产物（Windows Setup）
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: copper-launcher-${{ steps.built.outputs.tag }}-windows-setup
          path: build/dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      # 三个 ABI 是同一次构建出来的，这里只是分开上传
      - name: 上传产物（Android arm64-v8a）
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: copper-launcher-${{ steps.built.outputs.tag }}-android-arm64-v8a
          path: build/dist/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传产物（Android armeabi-v7a）
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: copper-launcher-${{ steps.built.outputs.tag }}-android-armeabi-v7a
          path: build/dist/*-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传产物（Android x86_64）
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: copper-launcher-${{ steps.built.outputs.tag }}-android-x86_64
          path: build/dist/*-x86_64.apk
          if-no-files-found: error
          retention-days: 14

      # Linux / macOS 本来就是一条一个包
      - name: 上传产物（Linux / macOS）
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: copper-launcher-${{ steps.built.outputs.tag }}-${{ matrix.platform }}-${{ matrix.package }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14
