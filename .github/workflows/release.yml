name: 发布构建

# 发 release 或推 tag 时自动构建**所有平台**的产物并上传到那个 release
#
# 版本 / 通道 / 序号一律**从 tag 推**：`v0.3.0` → release，`v0.3.0-alpha1` → alpha 序号 1。
# 不要写死 `--channel release` —— 那样预发布包会被当成正式版，
# 自更新器的通道阶梯随即失效（内测用户收不到后续内测包）
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  resolve:
    name: 解析 tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
      seq: ${{ steps.parse.outputs.seq }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          full="${TAG#v}"
          base="${full%%-*}"
          rest="${full#"$base"}"
          channel=release
          seq=""
          case "$rest" in
            -alpha*) channel=alpha; seq="${rest#-alpha}" ;;
            -beta*)  channel=beta;  seq="${rest#-beta}" ;;
          esac

          if [ -z "$base" ]; then
            echo "::error::从 tag「$TAG」里推不出版本号"
            exit 1
          fi
          # release 事件若从分支发出，ref_name 会是分支名 —— 这里挡掉
          case "$base" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::tag 要是 v<版本> 形态（如 v0.3.0 / v0.3.0-alpha1），拿到的是「$TAG」"
              exit 1
              ;;
          esac

          prerelease=false
          if [ "$channel" != "release" ]; then
            case "$seq" in
              '' | *[!0-9]*)
                echo "::error::预发布 tag 必须带序号，如 v0.3.0-alpha1"
                exit 1
                ;;
            esac
            prerelease=true
          fi

          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "seq=$seq" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tag $TAG -> 版本 $base / 通道 $channel / 序号 ${seq:-无} / 预发布 $prerelease"

  build-linux:
    name: Linux
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # libsecret-1-dev 是 flutter_secure_storage_linux 编译时要的；
      # appimagetool 给 AppImage 打包用
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.appimage
          chmod +x appimagetool-x86_64.appimage
          sudo mv appimagetool-x86_64.appimage /usr/local/bin/appimagetool

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建并打包
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          SEQ: ${{ needs.resolve.outputs.seq }}
        run: |
          common=(--version "$VERSION" --channel "$CHANNEL" --mode release --no-bump --no-check
                  --yes --no-open-folder --platform linux)
          if [ -n "$SEQ" ]; then common+=(--seq "$SEQ"); fi

          # 先完整构建出 tar.gz，再跳过构建单独打 AppImage
          dart tool/build_release.dart "${common[@]}" --package tarball
          export APPIMAGETOOL=/usr/local/bin/appimagetool
          dart tool/build_release.dart "${common[@]}" --no-build --package appimage

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*
          prerelease: ${{ needs.resolve.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建并打包
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          SEQ: ${{ needs.resolve.outputs.seq }}
        run: |
          args=(--version "$VERSION" --channel "$CHANNEL" --mode release --no-bump --no-check
                --yes --no-open-folder --platform windows --package both)
          if [ -n "$SEQ" ]; then args+=(--seq "$SEQ"); fi
          dart tool/build_release.dart "${args[@]}"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*
          prerelease: ${{ needs.resolve.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Android
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 本机跑的是 JDK 23、项目字节码目标是 17，取 21 这个两端都稳的 LTS。
      # release apk 用的是 debug 签名（见 android/app/build.gradle.kts），不需要任何 secret
      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk 37 未必在 runner 预装的 SDK 里；接受许可后由 Gradle 自己下
      - name: 接受 Android 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建并打包
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          SEQ: ${{ needs.resolve.outputs.seq }}
        run: |
          # 安卓不走打包：脚本自己把 --split-per-abi 出来的 apk 收进 build/dist
          args=(--version "$VERSION" --channel "$CHANNEL" --mode release --no-bump --no-check
                --yes --no-open-folder --platform android --package none)
          if [ -n "$SEQ" ]; then args+=(--seq "$SEQ"); fi
          dart tool/build_release.dart "${args[@]}"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*
          prerelease: ${{ needs.resolve.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          SEQ: ${{ needs.resolve.outputs.seq }}
          # macOS 没签名会报错；这里一律不签名（产物只做验证用）
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: NO
        run: |
          args=(--version "$VERSION" --channel "$CHANNEL" --mode release --no-bump --no-check
                --yes --no-open-folder --platform macos --package dmg)
          if [ -n "$SEQ" ]; then args+=(--seq "$SEQ"); fi
          dart tool/build_release.dart "${args[@]}"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*
          prerelease: ${{ needs.resolve.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
