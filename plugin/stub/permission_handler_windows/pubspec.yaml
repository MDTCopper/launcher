name: permission_handler_windows
description: "A stub package to disable permission_handler on Windows."
version: 0.2.1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  permission_handler_platform_interface: ^4.0.0

# 假平台支持，绕过严格 Federated Plugins 校验机制
flutter:
  plugin:
    implements: permission_handler
    platforms:
      windows:
        dartPluginClass: FakePermissionWindows
